name: GHCR cleanup

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no deletion)'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/ghcr-cleanup.yml'
  schedule:
    - cron: '0 3 * * 0'

permissions:
  packages: write

concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: fess
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          validate: true
          # Leave images pushed within the last day alone, so a build that is
          # still pushing its platform images is never cleaned up.
          older-than: 1 day
          # Delete only on schedule, or on a manual run with dry-run turned off.
          # Pull requests always run as a dry run.
          dry-run: ${{ github.event_name == 'schedule' && 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false && 'false') || 'true' }}
